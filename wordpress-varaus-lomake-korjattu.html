<style>
.varaus-lomake {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
}
.varaus-lomake h2 {
    margin-bottom: 20px;
}
.varaus-lomake label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
    font-weight: bold;
}
.varaus-lomake input,
.varaus-lomake select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 16px;
    box-sizing: border-box;
}
.varaus-lomake button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #ff69b4;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
}
.varaus-lomake button:hover {
    background: #ff1493;
}
#viesti {
    margin-top: 15px;
    padding: 10px;
    border-radius: 4px;
    display: none;
}
.lisapalvelut {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: #f9f9f9;
    border-radius: 4px;
}
.hinta-yhteensa {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: #fff3cd;
    border-radius: 4px;
    font-size: 18px;
    font-weight: bold;
}
</style>

<div class="varaus-lomake">
    <h2>🐾 Tee varaus</h2>
    <div id="viesti"></div>

    <!-- Henkilötiedot -->
    <label>Etunimi</label>
    <input type="text" id="etunimi" placeholder="Etunimi" required>

    <label>Sukunimi</label>
    <input type="text" id="sukunimi" placeholder="Sukunimi" required>

    <label>Sähköposti</label>
    <input type="email" id="email" placeholder="email@example.com" required>

    <label>Puhelinnumero</label>
    <input type="tel" id="puhelin" placeholder="040 123 4567">

    <!-- Palvelutyyppi -->
    <label>Palvelu</label>
    <select id="palvelu" onchange="paivitaLomake()">
        <option value="">-- Valitse palvelu --</option>
        <option value="hoitola">Hoitola</option>
        <option value="hotelli">Hotelli</option>
    </select>

    <label>Eläin</label>
    <select id="elain" onchange="haeHinnat()">
        <option value="">-- Valitse eläin --</option>
    </select>

    <!-- Päivämäärät -->
    <div id="paivamaarat">
        <label id="alkupvm-label">Päivämäärä</label>
        <input type="date" id="alkupvm">
        <div id="loppupvm-div" style="display:none;">
            <label>Loppupäivä</label>
            <input type="date" id="loppupvm">
        </div>
    </div>

    <!-- Lisäpalvelut -->
    <div class="lisapalvelut" id="lisapalvelut">
        <h3>Lisäpalvelut</h3>
        <div id="palvelut-lista"></div>
    </div>

    <!-- Hinta -->
    <div class="hinta-yhteensa" id="hinta-yhteensa">
        Yhteensä: <span id="hinta">0</span>€
    </div>

    <button onclick="lahetaVaraus()">Tee varaus</button>
</div>

<script>
// ✅ KORJAUS 1: Oikea portti (5144, ei 5000)
const API_URL = 'http://localhost:5144';

let valitutPalvelut = [];
let perusHinta = 0;

// Hae eläimet API:sta
async function haeElaimet() {
    // Tarjoa suorat laji-valinnat: kissa tai koira
    const select = document.getElementById('elain');
    select.innerHTML = '<option value="">-- Valitse eläin --</option>';
    select.innerHTML += `<option value="cat" data-species="cat">Kissa</option>`;
    select.innerHTML += `<option value="dog" data-species="dog">Koira</option>`;
}

// Päivitä lomake palvelun mukaan
function paivitaLomake() {
    const palvelu = document.getElementById('palvelu').value;
    const loppupvm = document.getElementById('loppupvm-div');
    const alkuLabel = document.getElementById('alkupvm-label');

    if (palvelu === 'hotelli') {
        loppupvm.style.display = 'block';
        alkuLabel.innerText = 'Saapumispäivä';
    } else {
        loppupvm.style.display = 'none';
        alkuLabel.innerText = 'Päivämäärä';
    }
    haeHinnat();
}

// Hae hinnat API:sta
async function haeHinnat() {
    const palvelu = document.getElementById('palvelu').value;
    const elainSelect = document.getElementById('elain');
    const species = elainSelect.options[elainSelect.selectedIndex]?.getAttribute('data-species');

    if (!palvelu || !species) return;

    try {
        const res = await fetch(`${API_URL}/api/price/${species}/${palvelu}`);
        
        if (!res.ok) {
            throw new Error(`API virhe: ${res.status}`);
        }
        
        const hinnat = await res.json();

        const lista = document.getElementById('palvelut-lista');
        lista.innerHTML = '';
        perusHinta = 0;
        valitutPalvelut = [];

        hinnat.forEach(h => {
            if (h.serviceName === 'Perushoito' || h.serviceName === 'Yöpyminen') {
                perusHinta = h.amount;
            } else {
                lista.innerHTML += `
                    <div>
                        <input type="checkbox" id="palvelu_${h.id}" 
                            value="${h.amount}" 
                            data-nimi="${h.serviceName}"
                            onchange="laskeHinta()">
                        <label for="palvelu_${h.id}">
                            ${h.serviceName} — ${h.amount}€
                        </label>
                    </div>`;
            }
        });

        document.getElementById('lisapalvelut').style.display = 'block';
        document.getElementById('hinta-yhteensa').style.display = 'block';
        laskeHinta();
    } catch(err) {
        console.error('Hintojen haku epäonnistui:', err);
        naytaViesti('❌ Hintojen haku epäonnistui', 'error');
    }
}

// Laske hinta
function laskeHinta() {
    let yhteensa = perusHinta;
    const checkboxes = document.querySelectorAll('#palvelut-lista input:checked');
    valitutPalvelut = [];
    checkboxes.forEach(cb => {
        yhteensa += parseFloat(cb.value);
        valitutPalvelut.push(cb.getAttribute('data-nimi'));
    });
    document.getElementById('hinta').innerText = yhteensa.toFixed(2);
}

// ✅ KORJAUS 2 & 3: Korjaa validointi ja päivämäärä formaatti
async function lahetaVaraus() {
    // Hae arvot oikein
    const etunimi = document.getElementById('etunimi').value.trim();
    const sukunimi = document.getElementById('sukunimi').value.trim();
    const email = document.getElementById('email').value.trim();
    const puhelin = document.getElementById('puhelin').value.trim();
    const palvelu = document.getElementById('palvelu').value;
    const elainSelect = document.getElementById('elain');
    const alkupvm = document.getElementById('alkupvm').value;
    const loppupvm = document.getElementById('loppupvm').value || alkupvm;

    // Validointi - tarkista että kaikki pakolliset kentät on täytetty
    if (!etunimi) {
        naytaViesti('❌ Täytä etunimi', 'error');
        return;
    }
    if (!sukunimi) {
        naytaViesti('❌ Täytä sukunimi', 'error');
        return;
    }
    if (!email) {
        naytaViesti('❌ Täytä sähköposti', 'error');
        return;
    }
    if (!palvelu) {
        naytaViesti('❌ Valitse palvelu', 'error');
        return;
    }
    if (!elainSelect.value) {
        naytaViesti('❌ Valitse eläin', 'error');
        return;
    }
    if (!alkupvm) {
        naytaViesti('❌ Valitse päivämäärä', 'error');
        return;
    }
    if (palvelu === 'hotelli' && !document.getElementById('loppupvm').value) {
        naytaViesti('❌ Valitse myös loppupäivä hotelli-varaukselle', 'error');
        return;
    }

    // Luo varaus-olio oikeassa formaatissa (lähetetään animalSpecies)
    const species = elainSelect.options[elainSelect.selectedIndex]?.getAttribute('data-species');
    const varaus = {
        firstName: etunimi,
        lastName: sukunimi,
        email: email,
        phone: puhelin,
        animalSpecies: species,
        serviceType: palvelu,
        startDate: new Date(alkupvm + 'T00:00:00').toISOString(),  // ISO 8601 -formaatti
        endDate: new Date(loppupvm + 'T00:00:00').toISOString(),    // ISO 8601 -formaatti
        totalPrice: parseFloat(document.getElementById('hinta').innerText)
    };

    try {
        const res = await fetch(`${API_URL}/api/booking`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(varaus)
        });
        
        if (!res.ok) {
            let errorMessage = `HTTP ${res.status}`;
            try {
                const errorData = await res.json();
                errorMessage = errorData.error || errorData.message || errorMessage;
            } catch {
                // Response wasn't JSON; keep the HTTP status fallback.
            }
            throw new Error(errorMessage);
        }
        
        const data = await res.json();
        naytaViesti('✅ ' + data.message, 'success');
        
        // Nollaa lomake onnistumisen jälkeen
        document.getElementById('etunimi').value = '';
        document.getElementById('sukunimi').value = '';
        document.getElementById('email').value = '';
        document.getElementById('puhelin').value = '';
        document.getElementById('palvelu').value = '';
        document.getElementById('elain').value = '';
        document.getElementById('alkupvm').value = '';
        document.getElementById('loppupvm').value = '';
        
    } catch(err) {
        console.error('Varauksen lähetys epäonnistui:', err);
        naytaViesti(`❌ Varaus epäonnistui: ${err.message}`, 'error');
    }
}

// Näytä viesti
function naytaViesti(teksti, tyyppi) {
    const viesti = document.getElementById('viesti');
    viesti.style.display = 'block';
    viesti.style.background = tyyppi === 'success' ? '#d4edda' : '#f8d7da';
    viesti.style.color = tyyppi === 'success' ? '#155724' : '#721c24';
    viesti.style.border = tyyppi === 'success' ? '1px solid #c3e6cb' : '1px solid #f5c6cb';
    viesti.innerText = teksti;
}

// ✅ Lataa eläimet kun sivu aukeaa
haeElaimet();
</script>
